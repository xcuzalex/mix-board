<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MixNote app icon: a dot-grid canvas with a sticky note and a text card
       joined by an arrow, plus a pen stroke: notes, connections, free canvas.
       macOS icon grid: 824px rounded square inset 100px, soft shadow. -->
  <defs>
    <linearGradient id="t" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
    <pattern id="dots" width="58" height="58" patternUnits="userSpaceOnUse"><circle cx="29" cy="29" r="5" fill="#B8C2D0" fill-opacity="0.6"/></pattern>
    <filter id="s" x="40" y="60" width="944" height="944" filterUnits="userSpaceOnUse"><feDropShadow dy="14" stdDeviation="20" flood-color="#0B1B33" flood-opacity="0.22"/></filter>
    <filter id="c" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dy="10" stdDeviation="12" flood-color="#0B1B33" flood-opacity="0.16"/></filter>
    <clipPath id="k"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#s)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#t)"/></g>
  <rect x="100" y="100" width="824" height="824" fill="url(#dots)" clip-path="url(#k)"/>

  <!-- yellow sticky note, slightly tilted -->
  <g transform="rotate(-6 340 350)" filter="url(#c)">
    <rect x="200" y="210" width="290" height="290" rx="26" fill="#FFD95A"/>
    <path d="M250 290 H 430" stroke="#7A5A00" stroke-opacity="0.75" stroke-width="22" stroke-linecap="round"/>
    <path d="M250 350 H 400" stroke="#7A5A00" stroke-opacity="0.4" stroke-width="18" stroke-linecap="round"/>
    <path d="M250 405 H 380" stroke="#7A5A00" stroke-opacity="0.4" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- connector from sticky to card -->
  <path d="M470 470 C 560 520, 560 590, 560 600" stroke="#3478F6" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M528 586 L 562 628 L 594 584" stroke="#3478F6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- white text card -->
  <g filter="url(#c)">
    <rect x="420" y="640" width="400" height="200" rx="34" fill="#FFFFFF"/>
  </g>
  <rect x="421.5" y="641.5" width="397" height="197" rx="32.5" stroke="#0B1B33" stroke-opacity="0.08" stroke-width="3"/>
  <path d="M470 700 H 640" stroke="#1F2937" stroke-width="24" stroke-linecap="round"/>
  <path d="M470 760 H 760" stroke="#A3ACB9" stroke-width="18" stroke-linecap="round"/>
  <path d="M470 802 H 700" stroke="#A3ACB9" stroke-width="18" stroke-linecap="round"/>

  <!-- pen stroke -->
  <path d="M640 300 C 690 230, 760 230, 770 290 C 780 350, 700 360, 720 420 C 735 460, 800 450, 830 410" stroke="#F0573C" stroke-width="20" stroke-linecap="round" fill="none"/>
</svg>
