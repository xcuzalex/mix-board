[package]
name = "mixboard-tauri"
version = "0.1.0"
edition = "2024"

[dependencies]
mixboard-core = { path = "../mixboard-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
